name: impromptu

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-impromptu}
      POSTGRES_USER: ${POSTGRES_USER:-impromptu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-impromptu}
    # No host port on purpose: 5432 on the host collided with the other
    # projects' stacks running side by side. Reach it through the container
    # (`docker compose exec db psql -U impromptu impromptu`).
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Named database on purpose: with nothing named, pg_isready knocks on a
      # database called $POSTGRES_USER, which exists only while the two words
      # are the same, and writes a FATAL to the log every interval otherwise.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-impromptu} -d ${POSTGRES_DB:-impromptu}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Rate-limit counters, shared across API workers. No host port, for the
  # same reason as the database.
  redis:
    image: redis:8-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8009"
    ports:
      - "${WEB_PORT:-8009}:8009"
    volumes:
      - ./apps:/app/apps
      - ./impromptu:/app/impromptu
      # The bank, so editing a file and running seed_topics needs no rebuild.
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8009/api/v1/common/health').status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  db-data:
  redis-data:
